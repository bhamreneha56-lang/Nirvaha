<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NIRVAHA - Govt of Jharkhand</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400..900;1,400..900&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Plus Jakarta Sans', sans-serif;
        background-color: #f0f4f8;
      }
      
      /* 3D Faint Glassmorphism Look for all Cards */
      .rounded-2xl.bg-white, .rounded-xl.bg-white {
          background: linear-gradient(135deg, rgba(255, 255, 255, 0.9) 0%, rgba(255, 255, 255, 0.6) 100%) !important;
          backdrop-filter: blur(24px) saturate(150%);
          -webkit-backdrop-filter: blur(24px) saturate(150%);
          border: 1px solid rgba(255, 255, 255, 0.8) !important;
          box-shadow: 
              0 25px 50px -12px rgba(0, 0, 0, 0.05),
              0 0 0 1px rgba(255, 255, 255, 0.5) inset,
              0 4px 6px -4px rgba(0, 0, 0, 0.02) !important;
      }

      /* 3D Emboss for Sidebar and Header */
      aside, header {
          background: rgba(255, 255, 255, 0.75) !important;
          backdrop-filter: blur(30px) saturate(200%) !important;
          border-color: rgba(255, 255, 255, 0.5) !important;
      }

      /* Universal smooth 3D hover effects for buttons */
      button {
          transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1) !important;
      }
      button:hover:not(:disabled) {
          transform: translateY(-2px) scale(1.01);
          box-shadow: 0 12px 24px -10px rgba(0, 0, 0, 0.15) !important;
      }
      button:active:not(:disabled) {
          transform: translateY(1px) scale(0.98);
      }
      
      /* Make inputs look faintly 3D */
      input, textarea, select {
          background: rgba(255, 255, 255, 0.6) !important;
          border: 1px solid rgba(255, 255, 255, 0.8) !important;
          box-shadow: inset 0 2px 4px rgba(0,0,0,0.02) !important;
          backdrop-filter: blur(10px);
      }
      input:focus, textarea:focus, select:focus {
          background: rgba(255, 255, 255, 0.9) !important;
          box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.2), inset 0 2px 4px rgba(0,0,0,0.01) !important;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
